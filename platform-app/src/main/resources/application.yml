spring:
  application:
    name: task-platform
  profiles:
    # 默认本地开发；CI 用 ci（Testcontainers），预发/生产各自覆盖
    active: dev
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /
  # 响应头安全基线（§5.8.6）
  compression:
    enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # ⛔ 生产不得打印 SQL 与参数（会泄露 L3/L4 数据）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # ⛔ 不要配 logic-delete-field：本库**没有 deleted 列**。
      #    配了会让 MyBatis-Plus 给每条查询拼上 `WHERE deleted = 0`，直接报未知列。
      #    软状态一律用业务字段表达（sys_user.status / cancelled_at、task.status 等）。

springdoc:
  # ⛔ 安全默认：关。任何 profile 下都先关掉，只有 dev 显式打开。
  #    独立审计实测：此前 /v3/api-docs 与 /swagger-ui/index.html 在【未登录】下返回 200，
  #    等于把完整接口表公开 —— 而它既无 profile 门控，放行名单又写死。
  #    ⭐ 与 StartupSecretGuard、SecurityBaselineConfig 一样取"默认最严"：
  #      漏配的后果必须是「用不了 Swagger」，而不是「接口表被公开」。
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # 生产只暴露 health/info/prometheus；⛔ 不暴露 env/beans/heapdump
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.dsh.platform: DEBUG

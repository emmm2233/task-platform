spring:
  application:
    name: task-platform
  profiles:
    # 默认本地开发；CI 用 ci（Testcontainers），预发/生产各自覆盖
    active: dev
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /
  # 响应头安全基线（§5.8.6）
  compression:
    enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # ⛔ 生产不得打印 SQL 与参数（会泄露 L3/L4 数据）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # 生产只暴露 health/info/prometheus；⛔ 不暴露 env/beans/heapdump
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.dsh.platform: DEBUG

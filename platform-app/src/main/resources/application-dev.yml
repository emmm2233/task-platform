# =====================================================================
#  本地开发配置
#
#  ⚠️ 环境偏差说明（本机无 Docker）：
#     本文件默认走 local-mysql，连接**本机已在运行的 MySQL 8.4 服务**。
#     若你的机器有 Docker，先 `docker compose -f deploy/docker-compose.dev.yml up -d`，
#     **profile 仍然是 dev** —— compose 把 3306/6379 发布到宿主机，本文件直接可用。
#     ⛔ 不要再写 `dev,docker`（旧文档的说法）：仓库里【没有】application-docker.yml，
#        该 profile 不提供任何配置；而 StartupSecretGuard 只把 dev/local/test/ci
#        视为开发 profile ⇒ 带上一个未知 profile 会让应用因"开发默认密钥"拒绝启动（实测）。
#     ⚠️ compose 的 Redis 带口令（默认 redis123456）：要用到 Redis 的功能（验证码/登录态）
#        需再加 `--spring.data.redis.password=redis123456`，否则第一次使用会认证失败。
# =====================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ⚠️ characterEncoding 必须是 **Java 字符集名** UTF-8，
    #    ⛔ 不能写 utf8mb4（那是服务端字符集名，Connector/J 会报 Unsupported character encoding）
    url: jdbc:mysql://127.0.0.1:3306/task_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: "123456"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      # ⛔ READ-COMMITTED：转账/扣减场景下减少间隙锁带来的死锁概率；
      #    "先检查后更新"的竞态由条件 UPDATE 解决，不依赖可重复读（§3.2.1）
      transaction-isolation: TRANSACTION_READ_COMMITTED

  flyway:
    enabled: true
    # 迁移脚本单一来源是仓库根的 db/migration，由 maven-resources-plugin 在构建时拷进 classpath
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
    # ⭐ 必须关闭占位符替换：种子数据里的通知模板合法包含 ${taskTitle} 这类**业务**占位符
    #    （运行时由通知引擎替换），⛔ 不是 Flyway 占位符。
    #    开启时 Flyway 解析阶段会抛 "No value provided for placeholder: ${var}"。
    placeholder-replacement: false

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # ⚠️ ⛔ 不要写 password: ""！空字符串会被 Redisson 当成"有密码"而发送 AUTH，
      #    无密码的 Redis 会回 ERR Client sent AUTH, but no password is set 并让应用起不来。
      #    无密码就是不写这一行（null）。
      database: 0
      timeout: 3000ms

# ---- 加密与密钥 ----
# ⛔ 生产环境必须用环境变量注入，不得使用这里的开发值：
#    PLATFORM_KEK（信封加密主密钥）· PLATFORM_JWT_SECRET（JWT 签名密钥）
platform:
  crypto:
    kek: ${PLATFORM_KEK:ZGV2LW9ubHkta2VrLWRvLW5vdC11c2UtaW4tcHJvZCE=}
    phone-salt: ${PLATFORM_PHONE_SALT:dev-only-phone-salt}
    # HS256 要求 >= 32 字节
    jwt-secret: ${PLATFORM_JWT_SECRET:dev-only-jwt-secret-please-change-in-production-0123456789}

  # ---- 环境差异开关（供 health 与后续模块判断能力可用性）----
  env:
    docker-available: false
    redis-required: false     # T4 认证接入后置为 true
    mq-required: false        # T15/T29 接入后置为 true

# ---- 接口文档（⛔ 仅开发环境打开；生产由 application.yml 的默认值关闭）----
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

  /sub-orders/{subOrderId}/deliveries:
    post:
      operationId: postSub-ordersBySubOrderIdDeliveries
      tags: [order]
      summary: 提交交付物（可多轮 / 可按里程碑分批）
      parameters:
        - $ref: '#/components/parameters/SubOrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:

            schema: { $ref: '#/components/schemas/DeliveryRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /sub-orders/{subOrderId}/accept:
    post:
      operationId: postSub-ordersBySubOrderIdAccept
      tags: [order]
      summary: 验收通过（触发分账 + 抽成 + 信誉分加分）
      description: |
        ⭐ 结算链路：逐 `delivery_unit` 计算佣金（**只算佣金，实得用减法**）→ 校验配平 →
        写 `commission_detail`（含 **rule_snapshot 规则快照**）→ 双分录记账 → 分账指令。
        ⚠️ 验收通过后进入**不可逆**阶段：`SETTLED` 之后 ⛔ 不可再发起常规争端（只能走举报）。
      parameters:
        - $ref: '#/components/parameters/SubOrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                unitId: { type: integer, format: int64, description: 里程碑/批次验收时指定 }
                score: { type: integer, minimum: 1, maximum: 5, description: 同时提交评价 }
                comment: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /sub-orders/{subOrderId}/reject:
    post:
      operationId: postSub-ordersBySubOrderIdReject
      tags: [order]
      summary: 驳回并说明原因
      description: |
        理由必填；计入修改轮次。超过 `modifyRoundLimit`（默认 3）自动转争端工单。
        ⚠️ **恶意驳回会被裁决判定**：无正当理由驳回被判支持接单方的，发单方扣 15 分。
      parameters:
        - $ref: '#/components/parameters/SubOrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
                failedItemIds:
                  type: array
                  description: 未通过的验收项 id（对应验收标准）
                  items: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '32004': { $ref: '#/components/responses/Error' }
  /sub-orders/{subOrderId}/cancel:
    post:
      operationId: postSub-ordersBySubOrderIdCancel
      tags: [order]
      summary: 申请取消（双方协商 / 逾期取消）

openapi: 3.0.3

info:
  title: 任务撮合平台 API
  version: 1.0.0
  description: |
    # 任务撮合平台 · Web 端接口清单

    对应设计文档：`docs/2026-10-15-任务撮合平台-总体设计.md`
    数据库基线：`db/migration/V1~V5`

    ## 通用约定
    - 前缀：`/api/v1`；角色域路径即权限域：`/api/**`（用户）· `/api/v1/op/**`（操作员）· `/api/v1/admin/**`（管理员）
    - 认证：`Authorization: Bearer <accessToken>`（Access 15min + Refresh 7d 一次性）
    - **金额一律字符串**（`"1000.00"`），⛔ 不用 JSON number（避免各端浮点精度差异）
    - **时间一律 ISO-8601 带时区**（`2026-10-15T13:20:00+08:00`）
    - 写接口必须传 `Idempotency-Key`（金额/抢单/中标类**强制**）
    - 多端能力协商：`X-Client` / `X-Client-Version`
    - 列表分页：管理端用 `pageNum/pageSize`，**移动端信息流用 `cursor`**（offset 分页在下拉刷新时会重复/漏项）
    - 每个响应带 `traceId`，用户报障时直接提供

    ## ⛔ 三条不容违反的接口层红线
    1. **请求体里的 `userId` / `role` / `publisherId` 一律忽略**，身份只从令牌取（防越权）
    2. **金额一律服务端计算**，绝不接受客户端传入的应付金额
    3. **每个访问资源的接口都必须做对象级授权**（改他人订单 ID 必须 403/404）

  contact:
    name: 平台研发
  license:
    name: Proprietary

servers:
  - url: https://api.example.com/api/v1
    description: 生产
  - url: https://stg-api.example.com/api/v1
    description: 预发（与生产同构）
  - url: http://localhost:8080/api/v1
    description: 本地开发（支付走 MockPaymentGateway）

tags:
  - name: auth
    description: 认证与会话
  - name: account
    description: 账户、实名、信誉分
  - name: task
    description: 任务（发单方视角）· 三维类型与 18 状态
  - name: award
    description: 抢单与竞拍
  - name: order
    description: 订单履约、交付、验收
  - name: wallet
    description: 钱包、托管、提现、抽成预估
  - name: dispute
    description: 争端与仲裁
  - name: im
    description: 即时通讯
  - name: notify
    description: 通知
  - name: common
    description: 公共（分类、字典、端能力、上传）
  - name: op
    description: 操作员域（需 OPERATOR 身份 + 岗位权限点）
  - name: admin
    description: 管理域（需 ADMIN 身份）

security:
  - bearerAuth: []

paths:
  /auth/sms-code:
    post:
      operationId: postAuthSms-code
      tags: [auth]
      summary: 发送短信验证码
      description: |
        ⚠️ 四维限流：手机号 / IP / 设备指纹 / 全局。
        同号 1 小时 ≤5 条、1 天 ≤10 条。
        ⛔ 未通过图形验证码不得发送（否则会被用作短信轰炸机）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, scene, captchaTicket]
              properties:
                phone: { type: string, example: "13800138000" }
                scene:
                  type: string
                  enum: [REGISTER, LOGIN, RESET_PWD, BIND_PHONE, WITHDRAW]
                captchaTicket: { type: string, description: 图形验证码通过后返回的票据 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [auth]
      summary: 注册
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, smsCode, password]
              properties:
                phone: { type: string }
                smsCode: { type: string }
                password:
                  type: string
                  description: ≥8 位，含大小写与数字，⛔ 拒绝 Top 10 万弱口令
                inviteCode: { type: string }
      responses:
        '200':
          description: 注册成功（默认信誉分 60，等级 NORMAL）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: 密码 / 验证码登录
      description: |
        ⛔ 登录失败文案**不得区分**"账号不存在"与"密码错误"（防账号枚举）。
        失败 5 次锁定 15 分钟；触发后强制图形验证码。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginType, account]
              properties:
                loginType: { type: string, enum: [PASSWORD, SMS] }
                account: { type: string, description: 手机号 }
                password: { type: string }
                smsCode: { type: string }
                deviceId: { type: string, description: 设备指纹 }
                captchaTicket: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: 账号锁定（20006）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [auth]
      summary: 刷新令牌
      description: ⭐ Refresh Token **一次性使用**，用完即换、旧的立即失效（防重放）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 新的令牌对
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: 登出
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/menus:
    get:
      operationId: getAuthMenus
      tags: [auth]
      summary: 获取当前用户菜单与路由（⭐ 动态路由）
      description: |
        `web-admin` 登录后按此下发菜单与路由；操作员看不到「账号管理」「权限配置」。
        ⚠️ 前端菜单裁剪**只是体验优化，不是安全措施** —— 后端仍逐个接口鉴权。
      responses:
        '200':
          description: 菜单树
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MenuNode' }

  # ===================================================================
  # ACCOUNT · 账户 / 实名 / 信誉分
  # ===================================================================
  /account/profile:
    get:
      operationId: getAccountProfile
      tags: [account]
      summary: 我的资料
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
    put:
      operationId: putAccountProfile
      tags: [account]
      summary: 修改资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 32 }
                avatarUrl: { type: string }
                intro: { type: string, maxLength: 500 }
                serviceRegion: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /account/real-name:
    post:
      operationId: postAccountReal-name
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [account]
      summary: 提交实名认证
      description: ⚠️ 身份证号、证件图为 **L4 极敏感**数据：单独加密、独立 Bucket、审核岗才可解密查看。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [realType, realName, idCardNo, idCardFront, idCardBack]
              properties:
                realType: { type: string, enum: [PERSONAL, ENTERPRISE] }
                realName: { type: string }
                idCardNo: { type: string, description: 服务端立即加密，不回显、不落日志 }
                idCardFront: { type: string, description: 私有 Bucket key }
                idCardBack: { type: string }
                faceVerifyId: { type: string, description: 人脸核身流水号 }
                enterpriseName: { type: string }
                licenseNo: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    get:
      operationId: getAccountReal-name
      tags: [account]
      summary: 我的实名状态（返回脱敏串，不解密明文）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/RealNameInfo' }
  /account/credit:
    get:
      operationId: getAccountCredit
      tags: [account]
      summary: 我的信誉分与等级（UC-U-80）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CreditInfo' }
  /account/credit/privileges:
    get:
      operationId: getAccountCreditPrivileges
      tags: [account]
      summary: ⭐ 我的权益（唯一出口）
      description: |
        返回抢单门槛、进行中上限、排序权重、**抽成费率修正**、**提现周期**、托管要求、举证责任。
        ⛔ 前端展示的权益必须与后端实际执行的**同一份数据**，否则用户会看到"说好 T+1 却给了 T+3"。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/UserPrivileges' }
  /account/credit/logs:
    get:
      operationId: getAccountCreditLogs
      tags: [account]
      summary: 信誉分变动明细（UC-U-82）
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/CreditLog' }
  /account/credit/appeals:
    post:
      operationId: postAccountCreditAppeals
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [account]
      summary: 对扣分发起申诉（UC-U-83，一次性、7 天内）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditLogId, reason]
              properties:
                creditLogId: { type: integer, format: int64 }
                reason: { type: string, maxLength: 1000 }
                evidences: { type: array, items: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '70006': { $ref: '#/components/responses/Error' }
  /account/devices:
    get:
      operationId: getAccountDevices
      tags: [account]
      summary: 我的登录设备
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /account/devices/{deviceId}:
    delete:
      operationId: deleteAccountDevicesByDeviceId
      tags: [account]
      summary: 踢出某设备
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ===================================================================
  # TASK · 任务（发单方视角）
  # ===================================================================
  /tasks:
    get:
      operationId: getTasks
      tags: [task]
      summary: 任务大厅
      description: |
        默认只返回 `RECRUITING` / `BIDDING` 状态、且通过风控与可见性过滤的任务。
        **移动端请用 cursor 分页**（下拉刷新时 offset 会重复/漏项）。
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: categoryPath, in: query, schema: { type: string }, description: 按一级分类检索，如 "1" }
        - name: taskForm
          in: query
          schema: { $ref: '#/components/schemas/TaskForm' }
        - name: payMode
          in: query
          schema: { $ref: '#/components/schemas/PayMode' }
        - name: grantMode
          in: query
          schema: { $ref: '#/components/schemas/GrantMode' }
        - { name: amountMin, in: query, schema: { type: string } }
        - { name: amountMax, in: query, schema: { type: string } }
        - { name: lng, in: query, schema: { type: number, format: double }, description: 线下任务按真 km 距离排序 }
        - { name: lat, in: query, schema: { type: number, format: double } }
        - { name: maxDistanceKm, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [LATEST, AMOUNT_DESC, DISTANCE_ASC, CREDIT_DESC] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/TaskSummary' }
    post:
      operationId: postTasks
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [task]
      summary: 创建任务（草稿）
      description: |
        ⚠️ **校验规则随三维类型动态变化**（详见设计 §5.14.5）：
        - `taskForm=OFFLINE|HYBRID` → `location` 必填（含经纬度）、`serviceTimeSlots` 必填
        - `payMode=FIXED` → `price` 必填，且 `grantMode` 只能 `GRAB`
        - `payMode=BID` → `budgetMin/Max` 必填，且 `grantMode` 只能 `BID`
        - `payMode=BY_QUANTITY` → `unitPrice/quantity/unit` 必填
        - `payMode=BY_DAY` → `dayRate/days` 必填
        - `payMode=MILESTONE` → `milestones` ≥2 个且 Σ金额 == 总预算，且 **`awardMode` 只能 SINGLE**（Phase 1）
        - **`acceptanceItems` 至少 1 项**（⭐ 没有它，恶意驳回就无法裁决）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '200':
          description: 草稿创建成功（返回 taskNo）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          taskId: { type: integer, format: int64 }
                          taskNo: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getTasksByTaskId
      tags: [task]
      summary: 任务详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/TaskDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putTasksByTaskId
      tags: [task]
      summary: 编辑任务
      description: ⛔ 仅 `DRAFT` / `AUDIT_REJECTED` 可编辑；`taskForm` **发布后不可修改**。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/StateConflict' }
    delete:
      operationId: deleteTasksByTaskId
      tags: [task]
      summary: 删除草稿
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /tasks/{taskId}/publish:
    post:
      operationId: postTasksByTaskIdPublish
      tags: [task]
      summary: 提交发布
      description: 触发机审；命中则转人工审核队列（`PENDING_AUDIT`）。
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /tasks/{taskId}/cancel:
    post:
      operationId: postTasksByTaskIdCancel
      tags: [task]
      summary: 取消任务
      description: |
        未中标可免费取消；已中标需按规则赔付。
        ⚠️ 取消与抢单竞争同一行锁，**必有一个失败**（不会出现"既取消又中标"）。
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /tasks/{taskId}/status-logs:
    get:
      operationId: getTasksByTaskIdStatus-logs
      tags: [task]
      summary: 任务状态时间轴（UC-U-96）
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TaskStatusLog' }
  /tasks/mine:
    get:
      operationId: getTasksMine
      tags: [task]
      summary: 我发布的任务
      parameters:
        - name: statusGroup
          in: query
          schema: { type: string, enum: [DRAFT, RECRUIT, PERFORM, CLOSE, TERMINAL] }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/TaskSummary' }
  /tasks/preview-commission:
    post:
      operationId: postTasksPreview-commission
      tags: [wallet, task]
      summary: ⭐ 抽成预估（报价/发单时实时显示「金额 / 服务费 / 实得」三行明细）
      description: |
        口径：向**接单方**抽取，计费基数 = 结算单元金额。
        优先级：活动 > 分类 > 阶梯 > 基准，再叠加信誉分修正，最后钳制到 [1%, 20%]。
        ⚠️ 实得 **必须用减法**（`金额 − 佣金`），⛔ 不能两边各算一次（舍入会不配平，§5.12.3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: string, example: "1000.00" }
                categoryId: { type: integer, format: int64 }
                takerId:
                  type: integer
                  format: int64
                  description: 指定则按该用户信誉等级计算；不传则按当前登录用户
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CommissionPreview' }

  # ===================================================================
  # AWARD · 抢单与竞拍
  # ===================================================================
  /tasks/{taskId}/grab:
    post:
      operationId: postTasksByTaskIdGrab
      tags: [award]
      summary: ⭐ 抢单（先到先得）
      description: |
        **并发正确性由数据库判定**：`UPDATE task SET status='PENDING_START', assignee_id=?
        WHERE id=? AND status='RECRUITING' AND grant_mode='GRAB' AND assignee_id IS NULL`
        + 判断影响行数。Redis 锁只用于削峰，**不作为正确性依据**。

        前置闸门：实名已通过 · 信誉分 ≥ 门槛 · 进行中任务数 < 该等级上限 · 非发单方本人 · 未被拉黑。

        失败必须返回**可操作的原因**：
        - `31001` 正在被抢，请重试
        - `31002` 已被他人抢走（前端应展示相似任务推荐）
        - `70004` 信誉分不足 · `70005` 进行中任务数已达上限
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 抢单成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/GrabResult' }
        '409':
          description: 抢单失败（31001/31002/31003）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /tasks/{taskId}/bids:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getTasksByTaskIdBids
      tags: [award]
      summary: 报价列表
      description: 暗标模式下**仅任务发布者可见全部报价**；其他用户只能看到报价数量与自己的报价。
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [AMOUNT_ASC, AMOUNT_DESC, CREDIT_DESC, LATEST] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BidSummary' }
    post:
      operationId: postTasksByTaskIdBids
      tags: [award]
      summary: 提交报价
      description: 一人一份（`uk(task_id, bidder_id)`）；截止前可覆盖修改，历史入 `task_bid_history`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BidCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /tasks/{taskId}/bids/{bidId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: bidId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: patchTasksByTaskIdBidsByBidId
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [award]
      summary: 修改报价（写入历史留痕）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BidCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      operationId: deleteTasksByTaskIdBidsByBidId
      tags: [award]
      summary: 撤回报价（撤回后不可再报）
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /tasks/{taskId}/bids/{bidId}/shortlist:
    post:
      operationId: postTasksByTaskIdBidsByBidIdShortlist
      tags: [award]
      summary: 加入 / 移出围（可多选）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TaskId'
        - name: bidId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shortlisted: { type: boolean, default: true }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /tasks/{taskId}/award:
    post:
      operationId: postTasksByTaskIdAward
      tags: [award]
      summary: ⭐ 选定中标方（SINGLE / MULTI）
      description: |
        在**同一事务**内：锁定任务 → 校验状态 → 逐个置 `ACCEPTED` 并生成子订单 →
        其余报价置 `REJECTED` → 校验 `Σ子订单金额 + 佣金 ≤ 托管额` → 推进状态 → 发事件。

        **MULTI 硬约束**：① Σ金额+佣金 ≤ 托管额（⛔ 不能超发）；② `bids` 数量 ≤ `requiredCount`；
        ③ 每个子订单独立履约/验收/结算/争端；④ `payMode=MILESTONE` 时 Phase 1 不允许 MULTI。
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AwardRequest' }
      responses:
        '200':
          description: 中标成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/AwardResult' }
        '409':
          description: 状态不允许 / 超托管额（31005/31006）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /award/bids/mine:
    get:
      operationId: getAwardBidsMine
      tags: [award]
      summary: 我的报价
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [QUOTED, SHORTLISTED, ACCEPTED, REJECTED, WITHDRAWN] }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/BidSummary' }


# =====================================================================
#  安全扫描（GitHub Actions 版）
#
#  由 .gitlab-ci.yml 的 security stage 迁移：
#    · secret-scan      → gitleaks（每次 push / PR）
#    · sast (SonarQube) → 换成 CodeQL，见 codeql.yml
#                         （GitHub 原生、public 免费、无需服务器与 token）
#    · dependency-check → 保留，但改为【每周定时 + 手动触发】
#                         它要下载 NVD 数据库（首次 10～30 分钟且官方限速），
#                         放在每次 push 上会把反馈拖死。
#
#  ⛔ 原 image-scan（trivy）本就没迁移 —— 它在 GitLab 上就是个假门禁：
#     全仓没有 Dockerfile，也没有任何 docker build/push 步骤，
#     它扫的 tag 永远不存在。要恢复它，先补 Dockerfile + build/push job。
# =====================================================================

name: Security

on:
  push:
  pull_request:
  schedule:
    # 每周一 10:00（北京时间）。cron 用 UTC：02:00 UTC = 10:00 +08:00
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_OPTS: "-Dfile.encoding=UTF-8"
  MAVEN_CLI: "mvn -B -ntp"

jobs:
  # -------------------------------------------------------------------
  # 密钥泄露扫描
  # -------------------------------------------------------------------
  secret-scan:
    name: 密钥泄露扫描（gitleaks）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # ⭐ 必须全历史：fetch-depth 默认 1 只扫最后一次提交，
          #    而密钥往往躺在很久以前的 commit 里。
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # 依赖漏洞扫描（OWASP dependency-check）
  #
  # 只在每周定时与手动触发时跑，push/PR 时跳过。
  # 可选 secret：NVD_API_KEY —— 不配也能跑，但会被 NVD 限速。
  # -------------------------------------------------------------------
  dependency-check:
    name: 依赖漏洞扫描（OWASP）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # ⭐ 版本钉死：原 GitLab 版写 `org.owasp:dependency-check-maven:check`，
          #    不带版本会随时拉最新版 ⇒ 扫描结论不可重复。
          EXTRA=""
          if [ -n "$NVD_API_KEY" ]; then
            EXTRA="-DnvdApiKey=$NVD_API_KEY"
            echo "已使用 NVD_API_KEY（数据库下载会快很多）"
          else
            echo "⚠️ 未配置 NVD_API_KEY，NVD 会限速，可能要 10～30 分钟"
          fi
          # ⚠️ 抑制文件用绝对路径：多模块构建时相对路径会解析到子模块目录下，
          #    插件找不到文件会直接抛异常（原 CI 注释里记过这个坑）。
          $MAVEN_CLI -q org.owasp:dependency-check-maven:12.1.0:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile="$GITHUB_WORKSPACE/.owasp-suppressions.xml" \
            $EXTRA
      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.html'
          if-no-files-found: ignore

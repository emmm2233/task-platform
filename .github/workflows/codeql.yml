# =====================================================================
#  CodeQL 静态安全分析
#
#  替代原 GitLab 版的 sast job（SonarQube）。换的理由：
#    · 原 job 的规则是 `if: $SONAR_TOKEN` —— 需要自建 SonarQube 服务器
#      并配 SONAR_HOST_URL / SONAR_TOKEN 两个变量，不配就永远不跑；
#    · CodeQL 是 GitHub 原生，public 仓库完全免费、无需服务器与 token，
#      结果直接进仓库的 Security 标签页。
#
#  语言范围：只扫 Java（项目主体）。JS/TS 只有几十 KB，
#  且多是 e2e 脚本与静态原型，扫了是噪音还拖慢 CI。
# =====================================================================

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周三 11:00（北京时间）= 03:00 UTC
    - cron: '0 3 * * 3'

permissions:
  contents: read
  # ⭐ CodeQL 必须能写 security-events，否则 SARIF 结果上传会失败
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL 分析（Java）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          # 3.x 里 Java 的语言标识是 java-kotlin（java 仍可用作别名）
          languages: java-kotlin
          # 安全扩展查询集：比默认更严，覆盖更多 CWE
          queries: security-extended
      - name: 构建（autobuild）
        uses: github/codeql-action/autobuild@v3
      - name: 分析并上传结果
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

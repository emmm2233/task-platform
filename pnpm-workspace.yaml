# ⭐ pnpm 11 的放行键是 allowBuilds，【不是】onlyBuiltDependencies（旧键名写了不生效）。
# ⭐ 且每一项必须显式给 true 或 false —— 只写 true 的那些，其余仍会报
#    ERR_PNPM_IGNORED_BUILDS 让 install 失败。
#
# 另一个坑：pnpm 会自动在子项目下创建 pnpm-workspace.yaml，那会让子项目成为
# 【独立的 workspace 根】，仓库根的配置就管不到它了（pnpm 只认最近的根）。
# 已删除 apps/web-user 下那个，这里是唯一的 workspace 根。
packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  # esbuild 需要放置平台二进制，必须放行
  esbuild: true
  # core-js 的 postinstall 只是打印捐赠提示，与构建无关 —— 显式拒绝，
  # 既省时间也避免供应链面。显式写 false 而不是省略，否则 install 仍会失败。
  core-js: false
  core-js-pure: false
  # puppeteer 会下载 Chromium（几百 MB）。它是 uni-automator 拉来的测试依赖，
  # 而构建小程序完全不需要 —— 已从 devDependencies 移除，这里再显式拒绝兜底。
  puppeteer: false
